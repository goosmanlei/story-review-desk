<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">运行组件各自负责什么</title><desc id="desc">Web 和一个后台工作器是原生 Node 进程，数据库是 PostgreSQL。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">运行组件各自负责什么</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">HTTP</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">事务</text><path d="M790 198 C790 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="638" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">领取</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">执行</text><path d="M580 308 L680 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">登记</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="56" y="129" font-size="17" font-weight="650" fill="#8c4d4a">浏览器 / CLI</text><text x="56" y="152" font-size="12" fill="#4f4a42">用户发起阅读与动作</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">Web · Next.js</text><text x="376" y="152" font-size="12" fill="#4f4a42">页面、HTTP、业务事务</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="696" y="129" font-size="17" font-weight="650" fill="#655078">PostgreSQL</text><text x="696" y="152" font-size="12" fill="#4f4a42">对象、关系、队列与回执</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="56" y="289" font-size="17" font-weight="650" fill="#8c4d4a">宿主 Codex / 程序</text><text x="56" y="312" font-size="12" fill="#4f4a42">已有认证与受控协议</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="289" font-size="17" font-weight="650" fill="#886129">一个后台工作器</text><text x="376" y="312" font-size="12" fill="#4f4a42">并发 1 · 有界领取</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="696" y="289" font-size="17" font-weight="650" fill="#4c6940">实例媒体</text><text x="696" y="312" font-size="12" f