<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 635" role="img" aria-labelledby="title desc"><title id="title">表现、编排、规则与事务分层</title><desc id="desc">页面没有另一套业务规则，接口也不通过 HTTP 互相调用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">表现、编排、规则与事务分层</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">请求</text><path d="M470 198 C470 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="478" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">调用</text><path d="M470 198 C470 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="318" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">读取</text><path d="M150 358 C150 389 150 389 150 420" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="383" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">查询</text><path d="M470 358 C470 389 150 389 150 420" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="318" y="383" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">命令</text><path d="M260 468 L360 468" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="456" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">存取</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">页面与 CLI</text><text x="56" y="152" font-size="12" fill="#4f4a42">交互 · 草稿 · 阅读状态</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">接口层</text><text x="376" y="152" font-size="12" fill="#4f4a42">协议 · 参数 · 运行期</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#655078"/><text x="56" y="289" font-size="17" font-weight="650" fill="#655078">读取投影</text><text x="56" y="312" font-size="12" fill="#4f4a42">同一快照的完整上下文</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="289" font-size="17" font-weight="650" fill="#886129">编排与领域服务</text><text x="376" y="312" font-size="12" fill="#4f4a42">动作规划 · 对象约束</text></g><g><rect x="40" y="420" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="420" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="449" font-size="17" font-weight="650" fill="#48645e">事务与数据访问</text><text x="56" y="472" font-size="12" fill="#4f4a42">稳定加锁 · 回滚 · 查询</text></g><g><rect x="360" y="420" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="420" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="449" font-size="17" font-weight="650" fill="#4c6940">PostgreSQL / 媒体</text><text x="376" y="472" font-size="12" fill="#4f4a42">引用约束 · 不可变历史</text></g><text x="40" y="613" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
