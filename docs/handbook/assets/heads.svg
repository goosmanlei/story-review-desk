<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">草稿头前移，旧采用头继续有效</title><desc id="desc">r2 是新草稿，已采用头仍然指向 r1；只有正式确认后采用头才前移。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">草稿头前移，旧采用头继续有效</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">当前稿</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">指向</text><path d="M150 198 C150 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="318" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">采用版本</text><path d="M580 308 L680 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">指向</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">永久对象</text><text x="56" y="152" font-size="12" fill="#4f4a42">同一 sceneId</text><text x="56" y="169" font-size="12" fill="#4f4a42">version 随动作核对</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="376" y="129" font-size="17" font-weight="650" fill="#365c78">草稿头</text><text x="376" y="152" font-size="12" fill="#4f4a42">draft_revision_id</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="696" y="129" font-size="17" font-weight="650" fill="#365c78">修订 r2</text><text x="696" y="152" font-size="12" fill="#4f4a42">新稿 · 尚未采用</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">采用头</text><text x="376" y="312" font-size="12" fill="#4f4a42">adopted_revision_id</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="696" y="289" font-size="17" font-weight="650" fill="#4c6940">修订 r1</text><text x="696" y="312" font-size="12" fill="#4f4a42">原采用内容 · 不可变</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
