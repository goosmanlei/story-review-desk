<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 635" role="img" aria-labelledby="title desc"><title id="title">创作、判断和执行各有位置</title><desc id="desc">人做判断，AI 提供建议，工作器执行明确授权的长任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">创作、判断和执行各有位置</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">依据</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">定义</text><path d="M150 198 C150 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">提交</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">辅助</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">采用后核对</text><path d="M790 358 C790 389 470 389 470 420" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="638" y="383" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">明确执行</text><path d="M360 468 L260 468" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="456" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">登记结果</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">来源与正文</text><text x="56" y="152" font-size="12" fill="#4f4a42">作者整理、改写与提交</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="376" y="129" font-size="17" font-weight="650" fill="#655078">设定与需求</text><text x="376" y="152" font-size="12" fill="#4f4a42">身份、状态、素材用途</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="129" font-size="17" font-weight="650" fill="#886129">镜头与准备</text><text x="696" y="152" font-size="12" fill="#4f4a42">表达与空间、制作依据</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="56" y="289" font-size="17" font-weight="650" fill="#8c4d4a">人的判断</text><text x="56" y="312" font-size="12" fill="#4f4a42">审阅上下文 · 确认采用</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="289" font-size="17" font-weight="650" fill="#8c4d4a">AI 辅助</text><text x="376" y="312" font-size="12" fill="#4f4a42">讨论 → 预览 → 草稿</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="289" font-size="17" font-weight="650" fill="#886129">实际输入与授权</text><text x="696" y="312" font-size="12" fill="#4f4a42">精确版本 · 本轮资格</text></g><g><rect x="40" y="420" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="40" y="420" width="4" height="98" rx="2" fill="#4c6940"/><text x="56" y="449" font-size="17" font-weight="650" fill="#4c6940">观察与成片审阅</text><text x="56" y="472" font-size="12" fill="#4f4a42">登记不等于实际观察</text></g><g><rect x="360" y="420" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="420" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="449" font-size="17" font-weight="650" fill="#48645e">后台执行</text><text x="376" y="472" font-size="12" fill="#4f4a42">确定性处理 / 配置的模型</text></g><text x="40" y="613" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
