<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">运行原件与离线快照各司其职</title><desc id="desc">快照保存指针，LFS 保存独立恢复字节；只有显式导出时展开完整包。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">运行原件与离线快照各司其职</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">冻结</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">内容引用</text><path d="M260 308 L360 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">显式导出</text><path d="M150 198 C150 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="318" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">流式分块</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">离线还原</text><path d="M580 308 L680 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">完整导入</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="129" font-size="17" font-weight="650" fill="#48645e">当前业务数据库</text><text x="56" y="152" font-size="12" fill="#4f4a42">对象、修订与精确关系</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">当前／上一快照</text><text x="376" y="152" font-size="12" fill="#4f4a42">manifest 与 LFS 指针</text><text x="376" y="169" font-size="12" fill="#4f4a42">只保留一次前驱</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="696" y="129" font-size="17" font-weight="650" fill="#48645e">独立离线内容库</text><text x="696" y="152" font-size="12" fill="#4f4a42">完整字节按 SHA 去重</text><text x="696" y="169" font-size="12" fill="#4f4a42">不依赖运行原件或网络</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="56" y="289" font-size="17" font-weight="650" fill="#4c6940">运行媒体原件</text><text x="56" y="312" font-size="12" fill="#4f4a42">服务播放与查看</text><text x="56" y="329" font-size="12" fill="#4f4a42">review-library 共享硬链接</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="289" font-size="17" font-weight="650" fill="#48645e">临时完整项目包</text><text x="376" y="312" font-size="12" fill="#4f4a42">显式导出、下载或传输</text><text x="376" y="329" font-size="12" fill="#4f4a42">24 小时后按归属清退</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="696" y="289" font-size="17" font-weight="650" fill="#48645e">独立恢复实例</text><text x="696" y="312" font-size="12" fill="#4f4a42">标准导入与 SHA 核验</text><text x="696" y="329" font-size="12" fill="#4f4a42">新数据库，不切换当前实例</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
