<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">正式任务从澄清到完成</title><desc id="desc">讨论后批量发布；资源互斥派工，验收并关闭 Agent 后完成；固定七列表格审计。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">正式任务从澄清到完成</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">澄清完成</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">依赖与资源可执行</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">阶段保存</text><path d="M680 308 L580 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">逐项验收与关闭</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">追加记录</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="56" y="129" font-size="17" font-weight="650" fill="#8c4d4a">当场讨论</text><text x="56" y="152" font-size="12" fill="#4f4a42">目标、范围、可行性、验收</text><text x="56" y="169" font-size="12" fill="#4f4a42">未成熟部分不落盘</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">批量正式发布</text><text x="376" y="152" font-size="12" fill="#4f4a42">稳定标题、编号与依赖</text><text x="376" y="169" font-size="12" fill="#4f4a42">一次事务保存已确认任务</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="129" font-size="17" font-weight="650" fill="#886129">统一调度</text><text x="696" y="152" font-size="12" fill="#4f4a42">模型、资源、槽位核查</text><text x="696" y="169" font-size="12" fill="#4f4a42">专属服务创建、执行与关闭</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#655078"/><text x="56" y="289" font-size="17" font-weight="650" fill="#655078">固定表格审计</text><text x="56" y="312" font-size="12" fill="#4f4a42">七列、正式标题、类别与依赖</text><text x="56" y="329" font-size="12" fill="#4f4a42">北京时间、成果与关闭证据</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">验收、关闭与清理</text><text x="376" y="312" font-size="12" fill="#4f4a42">交回、主 Agent 验收</text><text x="376" y="329" font-size="12" fill="#4f4a42">关闭执行并保留聊天历史</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#365c78"/><text x="696" y="289" font-size="17" font-weight="650" fill="#365c78">检查点与恢复</text><text x="696" y="312" font-size="12" fill="#4f4a42">原操作与 Agent 核查</text><text x="696" y="329" font-size="12" fill="#4f4a42">按原轮次恢复，不重复调用</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
