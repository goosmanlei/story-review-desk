<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">正式任务从澄清到完成</title><desc id="desc">只有已澄清需求进入账本；中断后核查再继续。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">正式任务从澄清到完成</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">澄清完成</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">启动后领取</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">阶段保存</text><path d="M680 308 L580 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">达到验收标准</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">追加记录</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="56" y="129" font-size="17" font-weight="650" fill="#8c4d4a">当场澄清</text><text x="56" y="152" font-size="12" fill="#4f4a42">明确目标、范围、验收</text><text x="56" y="169" font-size="12" fill="#4f4a42">未成熟想法不落盘</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">正式发布</text><text x="376" y="152" font-size="12" fill="#4f4a42">永久编号与追加账本</text><text x="376" y="169" font-size="12" fill="#4f4a42">可并发发布</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="129" font-size="17" font-weight="650" fill="#886129">串行执行</text><text x="696" y="152" font-size="12" fill="#4f4a42">依赖与优先级领取</text><text x="696" y="169" font-size="12" fill="#4f4a42">版本、租约与进程核查</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#655078"/><text x="56" y="289" font-size="17" font-weight="650" fill="#655078">审计与结果</text><text x="56" y="312" font-size="12" fill="#4f4a42">时间、关系、验收证据</text><text x="56" y="329" font-size="12" fill="#4f4a42">长期保留，可重建视图</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">验收与清理</text><text x="376" y="312" font-size="12" fill="#4f4a42">逐项证据与成果引用</text><text x="376" y="329" font-size="12" fill="#4f4a42">保留任务与恢复信息</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#365c78"/><text x="696" y="289" font-size="17" font-weight="650" fill="#365c78">检查点与续办</text><text x="696" y="312" font-size="12" fill="#4f4a42">查原进程、版本及操作</text><text x="696" y="329" font-size="12" fill="#4f4a42">结果未知先阻塞核查</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
