<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">保存新稿，再提交和判断</title><desc id="desc">正常创作路径保存草稿、提交待审，并明确采用或要求修改。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">保存新稿，再提交和判断</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">提交</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">采用</text><path d="M470 198 C470 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="478" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">要求修改</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">修改</text><path d="M150 260 C150 229 150 229 150 198" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">新稿</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">禁用</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">DRAFT · 草稿</text><text x="56" y="152" font-size="12" fill="#4f4a42">保存产生新的不可变修订</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="129" font-size="17" font-weight="650" fill="#8c4d4a">SUBMITTED · 待审</text><text x="376" y="152" font-size="12" fill="#4f4a42">选择这一修订提交</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#4c6940"/><text x="696" y="129" font-size="17" font-weight="650" fill="#4c6940">ADOPTED · 采用</text><text x="696" y="152" font-size="12" fill="#4f4a42">判断与采用头一并更新</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="289" font-size="17" font-weight="650" fill="#365c78">保存修改</text><text x="56" y="312" font-size="12" fill="#4f4a42">继续修改、重新提交</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="289" font-size="17" font-weight="650" fill="#8c4d4a">CHANGES_REQUESTED</text><text x="376" y="312" font-size="12" fill="#4f4a42">保留具体修改意见</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="289" font-size="17" font-weight="650" fill="#886129">DISABLED · 禁用</text><text x="696" y="312" font-size="12" fill="#4f4a42">独立判断 · 阻断下传</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
