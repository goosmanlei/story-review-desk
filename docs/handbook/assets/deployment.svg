<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">同一提交，按目标顺序发布</title><desc id="desc">本地保留数据，VPS 导入冻结母本；失败和未知结果按原操作处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">同一提交，按目标顺序发布</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">干净 Git</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">先本地</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">成功后</text><path d="M680 308 L580 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">传输导入</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">公网核验</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="129" font-size="17" font-weight="650" fill="#48645e">固定核心 HEAD</text><text x="56" y="152" font-size="12" fill="#4f4a42">排除未提交与未跟踪文件</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="376" y="129" font-size="17" font-weight="650" fill="#655078">隔离构建与手册</text><text x="376" y="152" font-size="12" fill="#4f4a42">构建、依赖与清单校验</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="696" y="129" font-size="17" font-weight="650" fill="#365c78">本地切换</text><text x="696" y="152" font-size="12" fill="#4f4a42">保留当前业务数据库</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="56" y="289" font-size="17" font-weight="650" fill="#4c6940">实际核验与清理</text><text x="56" y="312" font-size="12" fill="#4f4a42">API、媒体、worker、SHA</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="289" font-size="17" font-weight="650" fill="#886129">VPS 候选与切换</text><text x="376" y="312" font-size="12" fill="#4f4a42">独立演示数据库</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#365c78"/><text x="696" y="289" font-size="17" font-weight="650" fill="#365c78">冻结本地业务包</text><text x="696" y="312" font-size="12" fill="#4f4a42">原件、媒体与精确关系</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
