<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 475" role="img" aria-labelledby="title desc"><title id="title">对象不是某一稿，修订才是确切内容</title><desc id="desc">一个对象拥有多个不可变修订，当前归属和修订归属分开保存。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">对象不是某一稿，修订才是确切内容</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">1 → 多</text><path d="M150 198 C150 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">当前归属</text><path d="M470 198 C470 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="478" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">精确归属</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">objects</text><text x="56" y="152" font-size="12" fill="#4f4a42">PK id · version · state</text><text x="56" y="169" font-size="12" fill="#4f4a42">draft / adopted revision</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="376" y="129" font-size="17" font-weight="650" fill="#655078">revisions</text><text x="376" y="152" font-size="12" fill="#4f4a42">PK id · FK object_id</text><text x="376" y="169" font-size="12" fill="#4f4a42">正文 JSONB · SHA</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="56" y="289" font-size="17" font-weight="650" fill="#4c6940">memberships</text><text x="56" y="312" font-size="12" fill="#4f4a42">owner_id → member_id</text><text x="56" y="329" font-size="12" fill="#4f4a42">当前归属与角色</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">revision_memberships</text><text x="376" y="312" font-size="12" fill="#4f4a42">revision_id → member_id</text><text x="376" y="329" font-size="12" fill="#4f4a42">原修订的成员与顺序</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
