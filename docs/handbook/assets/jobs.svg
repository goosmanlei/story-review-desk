<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">长任务需要可查询的最终状态</title><desc id="desc">未知结果先核查原操作，不能自动当作失败再执行一次。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">长任务需要可查询的最终状态</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">领取</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">成功</text><path d="M150 198 C150 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">取消</text><path d="M470 198 C470 229 470 229 470 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="478" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">结果不明</text><path d="M470 198 C470 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="638" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">已知失败</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="129" font-size="17" font-weight="650" fill="#48645e">QUEUED</text><text x="56" y="152" font-size="12" fill="#4f4a42">有界排队</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="129" font-size="17" font-weight="650" fill="#886129">RUNNING</text><text x="376" y="152" font-size="12" fill="#4f4a42">工作器领取 · 租约</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#4c6940"/><text x="696" y="129" font-size="17" font-weight="650" fill="#4c6940">SUCCEEDED</text><text x="696" y="152" font-size="12" fill="#4f4a42">结果与证明已登记</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="289" font-size="17" font-weight="650" fill="#48645e">CANCELLED</text><text x="56" y="312" font-size="12" fill="#4f4a42">取消已确认</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="289" font-size="17" font-weight="650" fill="#8c4d4a">RESULT_UNKNOWN</text><text x="376" y="312" font-size="12" fill="#4f4a42">核查请求编号与外部结果</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="289" font-size="17" font-weight="650" fill="#886129">FAILED</text><text x="696" y="312" font-size="12" fill="#4f4a42">失败原因已明确</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
