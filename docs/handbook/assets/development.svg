<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">实现、验证、文档和发布一起交付</title><desc id="desc">从明确业务意图开始，完成隔离验证后提交并以固定版本发布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">实现、验证、文档和发布一起交付</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">设计</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">验证</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">复核</text><path d="M680 308 L580 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">交付</text><path d="M360 308 L260 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">部署</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">明确业务变化</text><text x="56" y="152" font-size="12" fill="#4f4a42">对象、版本、成功与失败</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="129" font-size="17" font-weight="650" fill="#886129">所属领域实现</text><text x="376" y="152" font-size="12" fill="#4f4a42">接口与业务服务复用</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="696" y="129" font-size="17" font-weight="650" fill="#655078">隔离质检</text><text x="696" y="152" font-size="12" fill="#4f4a42">规则、事务、浏览器</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="289" font-size="17" font-weight="650" fill="#48645e">运行核验与清理</text><text x="56" y="312" font-size="12" fill="#4f4a42">本地 / VPS 实际结果</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="289" font-size="17" font-weight="650" fill="#48645e">提交并固定 SHA</text><text x="376" y="312" font-size="12" fill="#4f4a42">本轮代码 · 正常推送</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="696" y="289" font-size="17" font-weight="650" fill="#8c4d4a">同步手册</text><text x="696" y="312" font-size="12" fill="#4f4a42">图文、来源与覆盖检