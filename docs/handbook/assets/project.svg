<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 635" role="img" aria-labelledby="title desc"><title id="title">业务权威与派生阅读入口</title><desc id="desc">核心软件按提交发布，数据库与登记媒体是权威，目录和导出是可核验投影。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">业务权威与派生阅读入口</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M260 148 L360 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">发布</text><path d="M580 148 L680 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">启动</text><path d="M150 358 C150 389 150 389 150 420" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="383" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">导出</text><path d="M150 358 C150 389 470 389 470 420" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="318" y="383" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">同步</text><path d="M580 308 L680 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">相对链接</text><path d="M150 358 V382 H735 V358" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="442.5" y="376" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">映射</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="56" y="129" font-size="17" font-weight="650" fill="#48645e">核心软件</text><text x="56" y="152" font-size="12" fill="#4f4a42">源码、手册与工具</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="376" y="129" font-size="17" font-weight="650" fill="#48645e">受管软件包</text><text x="376" y="152" font-size="12" fill="#4f4a42">固定 SHA · 自包含发布</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#48645e"/><text x="696" y="129" font-size="17" font-weight="650" fill="#48645e">本机运行信息</text><text x="696" y="152" font-size="12" fill="#4f4a42">机器配置与私有回执</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="289" font-size="17" font-weight="650" fill="#365c78">业务数据库</text><text x="56" y="312" font-size="12" fill="#4f4a42">永久对象与不可变历史</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">登记媒体</text><text x="376" y="312" font-size="12" fill="#4f4a42">instance/media/SHA</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="696" y="289" font-size="17" font-weight="650" fill="#4c6940">资源审阅目录</text><text x="696" y="312" font-size="12" fill="#4f4a42">可读软链 · 只读投影</text></g><g><rect x="40" y="420" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="40" y="420" width="4" height="98" rx="2" fill="#655078"/><text x="56" y="449" font-size="17" font-weight="650" fill="#655078">可移植项目包</text><text x="56" y="472" font-size="12" fill="#4f4a42">模块数据、原件与媒体</text></g><g><rect x="360" y="420" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="420" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="449" font-size="17" font-weight="650" fill="#8c4d4a">故事指引副本</text><text x="376" y="472" font-size="12" fill="#4f4a42">按采用字节同步</text></g><text x="40" y="613" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
