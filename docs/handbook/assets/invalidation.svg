<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">换素材，不等于推翻需求和设计</title><desc id="desc">设计依赖需求定义；实际输入锁引用确切素材。变化只影响实际引用的版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">换素材，不等于推翻需求和设计</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M360 148 L260 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">DEFINITION</text><path d="M790 198 C790 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="478" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">ACTUAL_INPUT</text><path d="M260 308 L360 308" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="310" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">换版</text><path d="M580 308 L680 308" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="296" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">失效检查</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">相关下游</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="56" y="129" font-size="17" font-weight="650" fill="#655078">需求定义 r1</text><text x="56" y="152" font-size="12" fill="#4f4a42">需要一段雨声</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="376" y="129" font-size="17" font-weight="650" fill="#886129">镜头设计 r3</text><text x="376" y="152" font-size="12" fill="#4f4a42">依赖需求定义</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="129" font-size="17" font-weight="650" fill="#886129">实际输入锁 r2</text><text x="696" y="152" font-size="12" fill="#4f4a42">独立核对输入与权利</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="56" y="289" font-size="17" font-weight="650" fill="#4c6940">雨声版本 v1</text><text x="56" y="312" font-size="12" fill="#4f4a42">原采用素材</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#e8eee1" stroke="#4c6940" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#4c6940"/><text x="376" y="289" font-size="17" font-weight="650" fill="#4c6940">雨声版本 v2</text><text x="376" y="312" font-size="12" fill="#4f4a42">新采用素材</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="696" y="289" font-size="17" font-weight="650" fill="#8c4d4a">受影响下游</text><text x="696" y="312" font-size="12" fill="#4f4a42">按精确依赖重新核对</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
