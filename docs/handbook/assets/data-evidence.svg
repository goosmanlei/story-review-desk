<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 475" role="img" aria-labelledby="title desc"><title id="title">业务内容和判断一起留下依据</title><desc id="desc">dependencies 引用确切修订，reviews 与 provenance 保存判断和证明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#827766"/></marker></defs><rect width="100%" height="100%" fill="#fcfaf5" rx="8"/><g font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="40" y="40" fill="#332f29" font-size="23" font-weight="650">业务内容和判断一起留下依据</text><text x="40" y="68" fill="#726a5f" font-size="13">实线箭头：流向或精确依赖　·　虚线：关联／可选路径</text><path d="M680 148 L580 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="630" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">引用</text><path d="M360 148 L260 148" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="310" y="136" text-anchor="middle" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">精确版本</text><path d="M790 198 C790 229 790 229 790 260" fill="none" stroke="#827766" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="798" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">证明</text><path d="M470 260 C470 229 790 229 790 198" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="638" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">判断</text><path d="M150 198 C150 229 150 229 150 260" fill="none" stroke="#827766" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="158" y="223" text-anchor="start" font-size="11" fill="#6b6256" paint-order="stroke" stroke="#fcfaf5" stroke-width="5" stroke-linejoin="round">采用变化</text><g><rect x="40" y="100" width="220" height="98" rx="7" fill="#e5edf4" stroke="#365c78" stroke-opacity=".3"/><rect x="40" y="100" width="4" height="98" rx="2" fill="#365c78"/><text x="56" y="129" font-size="17" font-weight="650" fill="#365c78">依据修订</text><text x="56" y="152" font-size="12" fill="#4f4a42">来源、需求、素材或设计</text></g><g><rect x="360" y="100" width="220" height="98" rx="7" fill="#ece8f2" stroke="#655078" stroke-opacity=".3"/><rect x="360" y="100" width="4" height="98" rx="2" fill="#655078"/><text x="376" y="129" font-size="17" font-weight="650" fill="#655078">dependencies</text><text x="376" y="152" font-size="12" fill="#4f4a42">依赖修订 + 用途</text></g><g><rect x="680" y="100" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="680" y="100" width="4" height="98" rx="2" fill="#886129"/><text x="696" y="129" font-size="17" font-weight="650" fill="#886129">消费方修订</text><text x="696" y="152" font-size="12" fill="#4f4a42">镜头、输入锁或组装</text></g><g><rect x="40" y="260" width="220" height="98" rx="7" fill="#f3e8d8" stroke="#886129" stroke-opacity=".3"/><rect x="40" y="260" width="4" height="98" rx="2" fill="#886129"/><text x="56" y="289" font-size="17" font-weight="650" fill="#886129">invalidations</text><text x="56" y="312" font-size="12" fill="#4f4a42">变化来源与受影响修订</text></g><g><rect x="360" y="260" width="220" height="98" rx="7" fill="#f2e3e2" stroke="#8c4d4a" stroke-opacity=".3"/><rect x="360" y="260" width="4" height="98" rx="2" fill="#8c4d4a"/><text x="376" y="289" font-size="17" font-weight="650" fill="#8c4d4a">reviews</text><text x="376" y="312" font-size="12" fill="#4f4a42">对象 + 修订 + 决定</text></g><g><rect x="680" y="260" width="220" height="98" rx="7" fill="#e6ebe9" stroke="#48645e" stroke-opacity=".3"/><rect x="680" y="260" width="4" height="98" rx="2" fill="#48645e"/><text x="696" y="289" font-size="17" font-weight="650" fill="#48645e">provenance</text><text x="696" y="312" font-size="12" fill="#4f4a42">原身份、SHA 与证明内容</text></g><text x="40" y="453" font-size="12" fill="#807568">审阅台 · 系统架构手册</text></g></svg>
