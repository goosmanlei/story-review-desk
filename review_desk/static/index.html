<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>原始资料审阅台</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/polish.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="seal">寄</span><div><small>STORY REVIEW DESK / 原始资料</small><h1 id="instance-title">加载中…</h1></div></div><div class="top-actions"><span id="source-count"></span><button id="comments-toggle" type="button">查看评论</button></div></header>
  <div class="layout">
    <aside class="sidebar" aria-label="工作区导航"><div class="sidebar-head"><small>创作工作台</small><h2>从资料到全剧</h2><p>当前阶段：故事采编。其他创作环节沿同一系统逐步开放。</p></div><nav id="workspace-nav" aria-label="系统工作区"></nav><div id="source-section"><div class="source-heading">资料库 · 不同版本</div><nav id="source-list" aria-label="资料"></nav></div><div class="sidebar-foot">本机独立实例 · 业务数据可公开同步</div></aside>
    <main id="reader" tabindex="-1"><div id="source-view" aria-live="polite"></div><div id="configuration-view" hidden></div><div id="current-view" hidden></div></main>
  </div>
  <button id="selection-action" type="button" hidden>＋ 添加评论</button>
  <aside id="comment-panel" class="comment-panel" aria-label="文字评论" hidden>
    <header><div><small>原文关联意见</small><h2>文字评论 <span id="open-count"></span></h2></div><button id="comments-close" aria-label="收起评论" type="button">×</button></header>
    <div id="comment-body"></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
