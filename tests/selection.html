<!doctype html>
<meta charset="utf-8">
<title>文本圈选回归测试</title>
<style>body{font:15px/1.6 system-ui;margin:20px}iframe{width:1250px;height:900px;border:1px solid #bbb}.pass{color:#175f34}.fail{color:#a32020}#result{font-weight:bold}</style>
<h1>文本圈选回归测试</h1>
<p>在隔离实例中使用真实 DOM Range 与事件；鼠标真实拖动另做人工交互验收。</p>
<p id="result">运行中…</p><ol id="results"></ol>
<iframe src="/?workspace=story.sources&amp;source=fixture" title="隔离审阅台"></iframe>
<script>
const frame=document.querySelector('iframe'),results=document.querySelector('#results');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(condition,message)=>{if(!condition)throw Error(message)};
let w,d,passed=0,failed=0;
const settle=()=>new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));
const button=()=>d.querySelector('#selection-action');
const point=(node,offset)=>{
  const walker=d.createTreeWalker(node,w.NodeFilter.SHOW_TEXT);let text;
  while(text=walker.nextNode()){if(offset<=text.length)return [text,offset];offset-=text.length}
  throw Error('测试偏移越界');
};
async function select(first,start,last,end,{reverse=false,release=d.body}={}){
  first.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:1,button:0}));
  const a=point(first,start),b=point(last,end);
  w.getSelection().setBaseAndExtent(...(reverse?b:a),...(reverse?a:b));
  await settle();
  release.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:1,button:0}));
  release.dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true}));
  await settle();
}
async function reset(){
  w.getSelection().removeAllRanges();d.querySelector('#open-story-sources').click();
  d.querySelector('[data-source-id="fixture"]').click();
  d.querySelector('#comments-close').click();
  d.querySelector('#source-text p').scrollIntoView({block:'center'});
  await settle();
}
function quote(){button().click();return d.querySelector('.comment-editor q')?.textContent}
async function test(name,run){
  const row=document.createElement('li');results.append(row);
  try{await reset();await run();passed++;row.className='pass';row.textContent='PASS '+name}
  catch(error){failed++;row.className='fail';row.textContent='FAIL '+name+' — '+error.message;row.dataset.details=JSON.stringify({selection:w.getSelection().toString(),range:w.getSelection().rangeCount?[...w.getSelection().getRangeAt(0).getClientRects()].map(r=>r.toJSON()):[],host:d.querySelector('#source-view').getBoundingClientRect().toJSON(),button:button().getBoundingClientRect().toJSON()})}
}
async function main(){
  w=frame.contentWindow;d=w.document;
  for(let i=0;i<100&&!d.querySelector('#source-text p');i++)await pause(50);
  assert(d.querySelector('#source-text p'),'页面未加载');
  await test('正文内松手与已有高亮内选词',async()=>{
    const p=d.querySelector('#source-text p');await select(p,1,p,5,{release:p});
    assert(!button().hidden,'按钮未显示');assert(quote()==='乙𪎊丁','Unicode 或高亮内引用错误');
  });
  await test('拖到正文外松手仍显示按钮',async()=>{
    const p=d.querySelector('#source-text p');await select(p,0,p,7);
    assert(!button().hidden,'有效选区存在，但正文外松手未触发');assert(quote()==='甲乙𪎊丁，鼠','正文引用错误');
  });
  await test('仅 selectionchange 也能更新按钮',async()=>{
    const p=d.querySelector('#source-text p');w.getSelection().setBaseAndExtent(...point(p,0),...point(p,2));
    await pause(30);await settle();assert(!button().hidden,'未监听选区变化');
  });
  await test('评论未变化时后台刷新不打断正在拖选的正文',async()=>{
    const p=d.querySelector('#source-text p');p.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:1,button:0}));
    w.getSelection().setBaseAndExtent(...point(p,0),...point(p,2));
    await w.refreshComments();
    d.body.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:1,button:0}));await settle();
    assert(w.getSelection().toString()==='甲乙','未变化的评论刷新重建了正文，选区丢失');assert(!button().hidden,'刷新后选区按钮丢失');
  });
  await test('清除选区后立即移除旧按钮',async()=>{
    const p=d.querySelector('#source-text p');await select(p,0,p,2,{release:p});
    w.getSelection().removeAllRanges();await pause(30);await settle();assert(button().hidden,'旧按钮仍显示');
  });
  await test('反向跨段及 Unicode 引用准确',async()=>{
    const [a,b]=d.querySelectorAll('#source-text p');await select(a,1,b,3,{reverse:true});
    assert(!button().hidden,'反向选区无按钮');assert(quote()===a.textContent.slice(1)+'\n第二段','跨段引用不符');
  });
  await test('选区端点落在正文容器边界',async()=>{
    const host=d.querySelector('#source-text'),p=host.children[1],r=d.createRange();
    r.setStart(host,0);r.setEnd(...point(p,3));w.getSelection().removeAllRanges();w.getSelection().addRange(r);
    host.dispatchEvent(new w.MouseEvent('mouseup',{bubbles:true}));await pause(30);await settle();
    assert(!button().hidden,'容器端点被拒绝');assert(quote()===host.children[0].textContent+'\n第二段','边界引用错误');
  });
  await test('拖选中不出现遮挡鼠标的按钮',async()=>{
    const p=d.querySelector('#source-text p');p.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:1,button:0}));
    w.getSelection().setBaseAndExtent(...point(p,0),...point(p,5));await pause(30);await settle();assert(button().hidden,'拖选尚未结束就显示按钮');
    d.body.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:1}));await settle();assert(!button().hidden,'松手后未出现');
  });
  await test('点击评论按钮保留引用并打开编辑器',async()=>{
    const p=d.querySelector('#source-text p');await select(p,0,p,2,{release:p});
    button().dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerId:1,button:0}));
    const event=new w.MouseEvent('mousedown',{bubbles:true,cancelable:true});button().dispatchEvent(event);
    assert(event.defaultPrevented,'按钮未保护原选区');
    button().dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerId:1,button:0}));
    assert(quote()==='甲乙','按钮点击丢失引用');await settle();assert(!d.querySelector('#comment-panel').hidden,'编辑器未打开');assert(button().hidden,'打开编辑器后按钮未消失');
  });
  await test('长选区跨过滚动容器顶部时按钮仍可见',async()=>{
    const p=d.querySelector('#source-text p:last-child');p.scrollIntoView({block:'start'});
    d.querySelector('#source-view').scrollTop+=450;await settle();
    await select(p,0,p,310,{release:p});assert(!button().hidden,'长选区无按钮');
    const rect=button().getBoundingClientRect(),host=d.querySelector('#source-view').getBoundingClientRect();
    assert(rect.top>=Math.max(0,host.top)&&rect.bottom<=Math.min(w.innerHeight,host.bottom),'按钮落在滚动容器可视范围外');
    const line=w.getSelection().getRangeAt(0).getClientRects();
    assert(Math.abs(rect.top-line[line.length-1].top)<85,'按钮远离拖选终点');
  });
  await test('非正文选区与切换资料不保留旧按钮',async()=>{
    const p=d.querySelector('#source-text p');await select(p,0,p,2,{release:p});
    const heading=d.querySelector('#reader-head-title');w.getSelection().setBaseAndExtent(...point(heading,0),...point(heading,2));
    await pause(30);await settle();assert(button().hidden,'标题选区保留了旧正文按钮');
    await select(p,0,p,2,{release:p});d.querySelector('#open-story-structure').click();await settle();assert(button().hidden,'切换工作区后仍显示旧按钮');
  });
  await test('结构稿也支持正文外松手与跨块引用',async()=>{
    d.querySelector('#open-story-structure').click();
    const first=d.querySelector('[data-structure-block="a"]'),last=d.querySelector('[data-structure-block="b"]');first.scrollIntoView({block:'center'});await settle();
    await select(first,1,last,3);assert(!button().hidden,'结构稿正文外松手无按钮');assert(quote()===first.textContent.slice(1)+'\n第二段','结构稿引用错误');
  });
  for(const structure of [false,true])await test((structure?'结构稿':'正文')+'评论定位到长块末尾的原圈选',async()=>{
    if(structure)d.querySelector('#open-story-structure').click();
    const text=structure?'长结构定位测试':'长正文定位测试';
    d.querySelector('#comments-toggle').click();
    const card=[...d.querySelectorAll('.comment-card')].find(node=>node.textContent.includes(text));
    assert(card,'未找到定位测试评论');
    [...card.querySelectorAll('button')].find(node=>node.textContent==='定位原圈选').click();
    await pause(800);await settle();
    const mark=d.querySelector((structure?'#structure-reader':'#source-text')+' .comment-mark.selected');
    assert(mark?.textContent==='定位目标𪎊：应该滚到这里。','原圈选未保持精确高亮');
    const rect=mark.getBoundingClientRect(),host=structure?{top:0,bottom:w.innerHeight}:d.querySelector('#source-view').getBoundingClientRect();
    assert(rect.top>=Math.max(0,host.top)&&rect.bottom<=Math.min(w.innerHeight,host.bottom),'定位后原圈选仍在可视范围外');
  });
  await test('制作思路往返保留正文阅读位置',async()=>{
    const reader=d.querySelector('#source-view');reader.scrollTop=180;await settle();const top=reader.scrollTop;
    w.switchWorkspace('production.approach');await settle();w.switchWorkspace('story.sources');await settle();
    assert(Math.abs(reader.scrollTop-top)<2,'切换制作思路丢失正文阅读位置');
  });
  await test('制作思路往返不删除未保存的评论草稿',async()=>{
    const p=d.querySelector('#source-text p');await select(p,0,p,2,{release:p});quote();
    const input=d.querySelector('#comment-editor-text');input.value='隔离测试草稿';input.dispatchEvent(new w.Event('input',{bubbles:true}));
    w.switchWorkspace('production.approach');await settle();w.switchWorkspace('story.sources');await settle();
    const same=d.querySelector('#source-text p');await select(same,0,same,2,{release:same});quote();
    assert(d.querySelector('#comment-editor-text').value==='隔离测试草稿','未保存草稿被清除');
  });
  await test('制作思路 Tab 与浏览器历史同步',async()=>{
    w.switchWorkspace('production.approach');d.querySelector('#approach-tab-story').click();await settle();
    d.querySelector('#approach-tab-materials').click();await settle();
    assert(new URL(w.location.href).searchParams.get('tab')==='materials','Tab 未写入直接链接');
    assert(d.querySelector('#approach-tab-materials').getAttribute('aria-selected')==='true','素材 Tab 未选中');
    const backward=new Promise(resolve=>w.addEventListener('popstate',resolve,{once:true}));w.history.back();await backward;await settle();
    assert(d.querySelector('#approach-tab-story').getAttribute('aria-selected')==='true','后退未恢复故事 Tab');
    const forward=new Promise(resolve=>w.addEventListener('popstate',resolve,{once:true}));w.history.forward();await forward;await settle();
    assert(d.querySelector('#approach-tab-materials').getAttribute('aria-selected')==='true','前进未恢复素材 Tab');
  });
  const count=await fetch('/api/comments').then(r=>r.json());assert(count.length===3,'浏览器测试意外创建了评论');
  document.querySelector('#result').textContent=`${passed} passed, ${failed} failed`;
  document.title=`${failed?'FAIL':'PASS'} — 文本圈选回归测试`;
}
frame.addEventListener('load',()=>main().catch(error=>{document.querySelector('#result').textContent='ERROR '+error.message}));
</script>
